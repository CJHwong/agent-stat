[package]
name = "agent-stat-tmux"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
crossterm = "0.29"
libc = "0.2"
sha2 = "0.10"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[profile.release]
strip = true
lto = "thin"
